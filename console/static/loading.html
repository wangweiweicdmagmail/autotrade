<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>autotrade 正在启动</title>
  <link rel="icon" href="data:," />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1fr);
      place-items: center; padding: clamp(16px, 3vw, 36px);
      background: radial-gradient(circle at 50% 20%, #202a42 0, #131722 48%, #0d1017 100%);
      color: #d1d4dc; font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .loading-card { width: min(900px, 100%); min-width: 0; padding: clamp(20px, 3.5vw, 40px);
      border: 1px solid #2a2e39; border-radius: 16px; background: #1e222df2;
      box-shadow: 0 24px 80px #0008; }
    .brand-row { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 14px; }
    .logo { color: #fff; font-size: 28px; font-weight: 750; letter-spacing: -.5px; }
    .mode { padding: 3px 8px; border: 1px solid #3b4356; border-radius: 5px;
      color: #959cab; font-size: 11px; letter-spacing: 1px; }
    h1 { margin: 24px 0 8px; color: #f2f4f8; font-size: clamp(20px, 2.5vw, 26px); font-weight: 600; }
    .subtitle { margin: 0; color: #787b86; font-size: 13px; line-height: 1.7; }
    .progress { height: 4px; margin: 26px 0 24px; overflow: hidden;
      border-radius: 4px; background: #2a2e39; }
    .progress-bar { width: 0; height: 100%; border-radius: inherit;
      background: #2962ff; transition: width .45s ease; }
    .stages { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .stage { display: flex; align-items: flex-start; gap: 12px; min-width: 0; min-height: 78px;
      padding: 14px; border: 1px solid #2a2e39; border-radius: 8px;
      background: #181c25; transition: border-color .25s, background .25s; }
    .stage.ready { border-color: #24543a; background: #14291c55; }
    .stage-icon { width: 20px; height: 20px; flex: none; display: grid; place-items: center;
      border: 2px solid #4b5262; border-radius: 50%; color: transparent; font-size: 12px; }
    .stage:not(.ready) .stage-icon { border-top-color: #6ea8ff; animation: spin 1.1s linear infinite; }
    .stage.optional:not(.ready) .stage-icon { border-color: #d9a441; color: #d9a441; animation: none; }
    .stage.optional:not(.ready) .stage-icon::before { content: "!"; }
    .stage.ready .stage-icon { border-color: #22c55e; color: #22c55e; }
    .stage.ready .stage-icon::before { content: "✓"; }
    .stage-copy { min-width: 0; flex: 1; }
    .stage-label { color: #e5e8ef; font-size: 14px; font-weight: 600; }
    .stage-detail { margin-top: 4px; color: #a1a9ba;
      font-size: 12px; line-height: 1.65; overflow-wrap: anywhere; }
    .error { display: none; margin-top: 16px; padding: 10px 12px; border-radius: 7px;
      background: #3a151866; color: #f1a1a1; font-size: 12px; line-height: 1.6; overflow-wrap: anywhere; }
    .market-progress { display: block; width: 100%; height: 8px; margin-top: 6px; accent-color: #6ea8ff; }
    .cache-panel { margin-top: 16px; padding: 12px; border: 1px solid #856538;
      border-radius: 8px; background: #33291e; color: #f4d39b; font-size: 13px; line-height: 1.6; }
    .cache-panel ul { margin: 6px 0 10px; padding-inline-start: 20px; }
    .cache-panel button { padding: 6px 12px; border: 1px solid #856538; border-radius: 6px;
      background: #453521; color: inherit; cursor: pointer; margin: 0 6px 4px 0; }
    .cache-panel button:disabled { opacity: .6; cursor: default; }
    .footer { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px 16px; margin-top: 22px;
      color: #959cab; font-size: 12px; }
    #status-text { min-width: 0; overflow-wrap: anywhere; }
    #elapsed { flex-shrink: 0; font-variant-numeric: tabular-nums; }
    .ready-text { color: #22c55e; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 640px) {
      .stages { grid-template-columns: minmax(0, 1fr); gap: 10px; }
      .stage { min-height: 0; padding: 12px; }
      h1 { margin-top: 20px; }
      .progress { margin: 20px 0; }
    }
    @media (max-height: 650px) { body { align-items: start; } }
    @media (prefers-reduced-motion: reduce) {
      .stage-icon { animation: none !important; }
      .stage, .progress-bar { transition: none; }
    }
  </style>
</head>
<body>
  <main class="loading-card">
    <div class="brand-row"><span class="logo">autotrade</span><span class="mode">STARTING</span></div>
    <h1 id="heading">正在准备交易工作区</h1>
    <p class="subtitle">全部服务与图表数据就绪后自动进入主页面，请勿关闭此标签页。</p>
    <div class="progress"><div id="progress-bar" class="progress-bar"></div></div>
    <div id="stages" class="stages"></div>
    <div id="error" class="error"></div>
    <section id="cache-panel" class="cache-panel" hidden>
      <strong>指标正文缓存需要处理</strong>
      <ul id="cache-issues"></ul>
      <button id="repair-cache" type="button">修复指标缓存</button>
      <button id="continue-startup" type="button" hidden>进入控制台</button>
      <div id="cache-result" role="status"></div>
    </section>
    <div class="footer"><span id="status-text">正在连接交易服务…</span><span id="elapsed">0s</span></div>
  </main>
  <script>
    const stagesEl = document.getElementById('stages');
    const progressEl = document.getElementById('progress-bar');
    const errorEl = document.getElementById('error');
    const statusEl = document.getElementById('status-text');
    const elapsedEl = document.getElementById('elapsed');
    const cachePanel = document.getElementById('cache-panel');
    const cacheIssues = document.getElementById('cache-issues');
    const repairButton = document.getElementById('repair-cache');
    const continueButton = document.getElementById('continue-startup');
    const cacheResult = document.getElementById('cache-result');
    let repairing = false;
    let repaired = false;
    continueButton.onclick = () => location.replace('/');

    repairButton.onclick = async () => {
      repairing = true;
      repairButton.disabled = true;
      cacheResult.textContent = '正在获取并验证 TradingView 指标正文…';
      try {
        const response = await fetch('/api/startup/repair-pine-cache', {
          method: 'POST', headers: { 'X-Autotrade-Action': 'repair-pine-cache' },
        });
        const data = await response.json();
        if (!response.ok || !data.ok) throw new Error(data.detail || '修复失败');
        repaired = true;
        cacheResult.textContent = '缓存已修复并通过验证。请重启 AutoTrade，使行情采集器重新加载指标。';
      } catch (error) {
        cacheResult.textContent = error.message || '修复失败，请重试。';
      } finally {
        repairing = false;
        repairButton.disabled = repaired;
      }
    };

    function render(data) {
      stagesEl.replaceChildren();
      const stages = data.stages || [];
      for (const stage of stages) {
        const row = document.createElement('div');
        row.className = 'stage' + (stage.ready ? ' ready' : '') + (stage.blocking === false ? ' optional' : '');
        const icon = document.createElement('span');
        icon.className = 'stage-icon';
        const copy = document.createElement('div');
        copy.className = 'stage-copy';
        const label = document.createElement('div');
        label.className = 'stage-label';
        label.textContent = stage.label;
        const detail = document.createElement('div');
        detail.className = 'stage-detail';
        detail.textContent = stage.detail || '';
        copy.append(label, detail);
        const market = data.market_progress;
        if (stage.key === 'market' && market && market.total) {
          const progress = document.createElement('progress');
          progress.className = 'market-progress';
          progress.max = market.total;
          progress.value = market.confirmed;
          progress.setAttribute('aria-label', '标的确认指标就绪进度');
          const steps = document.createElement('div');
          steps.className = 'stage-detail';
          const indicators = market.indicators || {};
          steps.textContent = [
            data.market_session?.requested === '24h' && `行情时段 ${data.market_session.confirmed}/${market.total}`,
            `K 线已到 ${market.bars_ready ?? 0}/${market.total}`,
            indicators.total && `指标正文 ${indicators.loaded}/${indicators.total}`,
            indicators.name && `当前指标 ${indicators.name}`,
            `已发起订阅 ${market.subscribed}/${market.total}`,
          ].filter(Boolean).join(' · ');
          copy.append(progress, steps);
          if (data.market_pending?.length) {
            const pending = document.createElement('div');
            pending.className = 'stage-detail';
            pending.textContent = '等待标的：' + data.market_pending.map(s => s.split(':').pop()).join('、');
            copy.append(pending);
          }
        }
        row.append(icon, copy);
        stagesEl.append(row);
      }
      const required = stages.filter(stage => stage.blocking !== false);
      const readyCount = required.filter(stage => stage.ready).length;
      progressEl.style.width = (required.length ? readyCount / required.length * 100 : 0) + '%';
      elapsedEl.textContent = (data.elapsed || 0) + 's';
      errorEl.style.display = data.error ? 'block' : 'none';
      errorEl.textContent = data.error || '';
      statusEl.textContent = data.ready ? '工作区已就绪' : '正在准备，请稍候';
      const issues = data.cache_issues || [];
      cacheIssues.replaceChildren(...issues.map(issue => {
        const item = document.createElement('li');
        item.textContent = issue.cached_version
          ? `${issue.name} 缓存 v${issue.cached_version} 与 TradingView v${issue.remote_version} 不匹配`
          : `${issue.name} 缺少 TradingView v${issue.remote_version} 的正文缓存`;
        return item;
      }));
      cachePanel.hidden = !issues.length && !repairing && !repaired;
      repairButton.disabled = !issues.length || repairing || repaired || data.cache_repair_running;
      continueButton.hidden = !data.ready;
    }

    async function check() {
      try {
        const response = await fetch('/api/startup', { cache: 'no-store' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const data = await response.json();
        render(data);
        if (data.ready && cachePanel.hidden && !data.cache_repair_running) {
          document.getElementById('heading').textContent = '交易工作区已就绪';
          statusEl.textContent = '正在进入主页面…';
          statusEl.className = 'ready-text';
          progressEl.style.width = '100%';
          setTimeout(() => location.replace('/'), 300);
          return;
        }
      } catch (error) {
        statusEl.textContent = '正在连接交易服务…';
      }
      setTimeout(check, 1000);
    }

    check();
  </script>
</body>
</html>
