<text x="95" y="2230" class="sub">实线箭头：主数据 / 订单流      青色实线：券商回报      虚线：配置、控制、支撑或复用关系</text>
<text x="95" y="2290" class="body">阅读要点：策略模型决定“是否交易、方向和价格”；执行模型决定“如何安全、可恢复地完成交易”。</text>
<text x="95" y="2340" class="code">范围说明：本图为当前 Pine 主执行链路的逻辑架构；职责模块不等于独立进程或微服务。</text>
<text x="95" y="2380" class="code">回测限制：OHLC 无法还原真实根内成交顺序；图中未表示第二个真实策略已注册。</text>
<text x="95" y="2420" class="code">兼容说明：既有 API、模型标识与持久化字段保留；历史入口、独立跟单及研究辅助流程未展开。</text>
