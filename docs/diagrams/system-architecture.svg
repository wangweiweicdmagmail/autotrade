<text x="60" y="80" class="title">Pine 驱动的量化交易执行系统</text>
<text x="60" y="128" class="sub">当前实现架构 · 策略模型生成决策，执行模型管理交易 · 2026-11-02</text>
<text x="60" y="200" class="lane">声明与执行配置</text>
<text x="690" y="200" class="lane">主链路：策略输出 → 交易执行 → 券商</text>
<text x="2000" y="200" class="lane">运维与运行保障</text>
<rect x="690" y="230" width="1220" height="160" rx="18" fill="#e5f5f0" stroke="#8bc9b4" stroke-width="2"/>
<text x="716" y="275" class="heading">01  策略模型  /  Strategy Model</text>
<text x="716" y="315" class="body">TradingView Pine 指标：生成方向、入场条件、参考价和策略止损</text>
<text x="716" y="349" class="body">当前：EMA9-ST-ATR；后续策略复用相同输出契约</text>
<rect x="690" y="450" width="1220" height="160" rx="18" fill="#ffffff" stroke="#cdd8e4" stroke-width="2"/>
<text x="716" y="495" class="heading">02  策略输出契约  /  Strategy Output Contract</text>
<text x="716" y="535" class="body">入场信号 · 方向 · 入场参考价 · 多头止损 · 空头止损</text>
<text x="716" y="569" class="body">ATR 为辅助输出；信号出现不代表已下单或已成交</text>
<text x="716" y="598" class="code">StrategyOutput (PineOutput) / domain/contracts.py</text>
<rect x="690" y="670" width="1220" height="170" rx="18" fill="#ffffff" stroke="#cdd8e4" stroke-width="2"/>
<text x="716" y="715" class="heading">03  行情与信号接入层</text>
<text x="716" y="755" class="body">订阅指标与行情，依据字段映射形成带时间信息的快照</text>
<text x="716" y="789" class="body">实时快照 + 确认快照 + 最新行情价格</text>
<text x="716" y="828" class="code">service/tv_cloud*.js  /  行情采集模块</text>
<rect x="690" y="900" width="1220" height="170" rx="18" fill="#ffffff" stroke="#cdd8e4" stroke-width="2"/>
<text x="716" y="945" class="heading">04  执行编排服务</text>
<text x="716" y="985" class="body">启停执行实例、检查容量，按模型 / 实例 / 标的分发快照</text>
<text x="716" y="1019" class="body">校验时间对齐和输出，分别推进实时与确认处理</text>
<text x="716" y="1058" class="code">AutoService  /  StrategyRuntime</text>
<rect x="690" y="1130" width="1220" height="230" rx="18" fill="#eaf2ff" stroke="#91b3df" stroke-width="2"/>
<text x="716" y="1175" class="heading">05  交易执行引擎  /  执行模型的运行组件</text>
<text x="716" y="1215" class="body">实时快照 → 入场校验、去重、风险定量、申请建仓</text>
<text x="716" y="1249" class="body">确认快照 → 止损收紧、方向反转退出</text>
<text x="716" y="1283" class="body">依据执行配置管理交易组；不重新计算 Pine 行情信号</text>
<text x="716" y="1348" class="code">engine/pine_execution.py  /  PineExecutionEngine</text>
<rect x="690" y="1420" width="1220" height="150" rx="18" fill="#ffffff" stroke="#cdd8e4" stroke-width="2"/>
<text x="716" y="1465" class="heading">06  交易通道适配层  /  实盘路径</text>
<text x="716" y="1505" class="body">将引擎操作转换为订单管理调用：建仓、撤单、平仓、移止损</text>
<text x="716" y="1558" class="code">LiveBroker  /  engine/broker_protocols.py</text>
<rect x="690" y="1630" width="1220" height="170" rx="18" fill="#ffffff" stroke="#cdd8e4" stroke-width="2"/>
<text x="716" y="1675" class="heading">07  订单管理模块</text>
<text x="716" y="1715" class="body">维护订单生命周期，管理限价入场单与保护止损单</text>
<text x="716" y="1749" class="body">提交前调用账户风险检查；接收成交与订单状态</text>
<text x="716" y="1788" class="code">execution/order_lot.py  /  OrderManager</text>
<rect x="690" y="1860" width="1220" height="140" rx="18" fill="#ffffff" stroke="#cdd8e4" stroke-width="2"/>
<text x="716" y="1905" class="heading">08  券商连接网关</text>
<text x="716" y="1945" class="body">传递委托、撤改单，接收订单 / 成交 / 账户信息</text>
<text x="716" y="1988" class="code">execution/ibkr.py  /  IBKRGateway</text>
<rect x="690" y="2060" width="1220" height="140" rx="18" fill="#edf0f4" stroke="#bdc9d5" stroke-width="2"/>
<text x="716" y="2105" class="heading">09  券商执行环境</text>
<text x="716" y="2145" class="body">IBKR / TWS：实际订单、成交、持仓与账户事实</text>
<rect x="60" y="450" width="540" height="300" rx="18" fill="#ffffff" stroke="#cdd8e4" stroke-width="2"/>
<text x="86" y="495" class="heading">策略模型注册表</text>
<text x="86" y="535" class="body">模型 ID / 指标 ID</text>
<text x="86" y="569" class="body">plot 与公共字段映射</text>
<text x="86" y="603" class="body">实时 / 确认快照键</text>
<text x="86" y="637" class="body">指定执行配置</text>
<text x="86" y="708" class="code">service/pine_strategies.json</text>
<text x="86" y="738" class="code">PineModelRegistry / pine_models.js</text>
<rect x="60" y="1010" width="540" height="300" rx="18" fill="#eaf2ff" stroke="#91b3df" stroke-width="2"/>
<text x="86" y="1055" class="heading">执行配置</text>
<text x="86" y="1095" class="body">single_entry：单次建仓</text>
<text x="86" y="1129" class="body">ema9_legacy_pyramid：</text>
<text x="86" y="1163" class="body">保留原金字塔、保本及时段规则</text>
<text x="86" y="1197" class="body">新策略不自动继承旧规则</text>
<text x="86" y="1298" class="code">execution_profile</text>
<rect x="60" y="1430" width="540" height="340" rx="18" fill="#ffffff" stroke="#cdd8e4" stroke-width="2"/>
<text x="86" y="1475" class="heading">回测与夜盘模拟验证</text>
<text x="86" y="1515" class="body">历史行情与已导出策略值</text>
<text x="86" y="1549" class="body">→ 独立的同类执行引擎</text>
<text x="86" y="1583" class="body">→ SimBroker 模拟成交</text>
<text x="86" y="1617" class="body">→ 交易记录与回测结果</text>
<text x="86" y="1651" class="body">实时夜盘：独立数据与模拟通道</text>
<text x="86" y="1728" class="code">BacktestSession / NightTestService</text>
<text x="86" y="1758" class="code">SimBroker / PinePaperFeed</text>
<rect x="60" y="1870" width="540" height="300" rx="18" fill="#ffffff" stroke="#cdd8e4" stroke-width="2"/>
<text x="86" y="1915" class="heading">执行实例与交易归属</text>
<text x="86" y="1955" class="body">strategy_id：策略模型</text>
<text x="86" y="1989" class="body">strategy_instance_id：执行实例</text>
<text x="86" y="2023" class="body">symbol：标的</text>
<text x="86" y="2057" class="body">group_id：一轮交易组</text>
<text x="86" y="2091" class="body">状态隔离，账户风险统一汇总</text>
<rect x="2000" y="450" width="540" height="290" rx="18" fill="#ffffff" stroke="#cdd8e4" stroke-width="2"/>
<text x="2026" y="495" class="heading">交易运维控制台</text>
<text x="2026" y="535" class="body">模型 / 实例 / 执行配置选择</text>
<text x="2026" y="569" class="body">启动、暂停及交易操作</text>
<text x="2026" y="603" class="body">订单、风险、恢复状态展示</text>
<text x="2026" y="637" class="body">HTTP / WebSocket 交互</text>
<text x="2026" y="698" class="code">console/routes + services</text>
<text x="2026" y="728" class="code">console/static</text>
<rect x="2000" y="980" width="540" height="340" rx="18" fill="#ffffff" stroke="#cdd8e4" stroke-width="2"/>
<text x="2026" y="1025" class="heading">状态持久化与恢复模块</text>
<text x="2026" y="1065" class="body">SQLite 事务保存订单与交易组</text>
<text x="2026" y="1099" class="body">版本校验、迁移与 JSON 导出</text>
<text x="2026" y="1133" class="body">持久化受理意图，按引用认回</text>
<text x="2026" y="1167" class="body">未知结果暂停新入场并告警</text>
<text x="2026" y="1201" class="body">重启对账与保护数量恢复</text>
<text x="2026" y="1278" class="code">execution/state_store.py</text>
<text x="2026" y="1308" class="code">OrderManager / writer_lock.py</text>
<rect x="2000" y="1480" width="540" height="300" rx="18" fill="#ffffff" stroke="#cdd8e4" stroke-width="2"/>
<text x="2026" y="1525" class="heading">风险控制模块</text>
<text x="2026" y="1565" class="body">计划风险 → 下单数量</text>
<text x="2026" y="1599" class="body">账户风险预算与交易约束</text>
<text x="2026" y="1633" class="body">按实际止损距离控制风险</text>
<text x="2026" y="1667" class="body">多个执行实例统一汇总</text>
<text x="2026" y="1738" class="code">RiskGate / order_calc</text>
<text x="2026" y="1768" class="code">OrderManager 中的风险检查</text>
<rect x="2000" y="1870" width="540" height="300" rx="18" fill="#ffffff" stroke="#cdd8e4" stroke-width="2"/>
<text x="2026" y="1915" class="heading">应用运行时</text>
<text x="2026" y="1955" class="body">创建应用与组装依赖</text>
<text x="2026" y="1989" class="body">管理后台任务和生命周期</text>
<text x="2026" y="2023" class="body">启动 / 清理资源</text>
<text x="2026" y="2057" class="body">注入隔离状态路径</text>
<text x="2026" y="2158" class="code">factory / bootstrap / tasks</text>
